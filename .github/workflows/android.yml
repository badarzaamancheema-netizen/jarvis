name: Build Jarvis Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Claude brain, tools, storage)
        run: ./gradlew :core:test

      # New builds only install over old ones when signed with the same key.
      # Best: add JARVIS_KEYSTORE_BASE64 + JARVIS_KEYSTORE_PASSWORD secrets (see android/README.md).
      # Otherwise a key is generated once and kept in the Actions cache.
      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing
          key: jarvis-signing-key-v1

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
            echo "JARVIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.jarvis-signing
            if [ ! -f ~/.jarvis-signing/jarvis-ci.jks ]; then
              keytool -genkeypair -keystore ~/.jarvis-signing/jarvis-ci.jks -alias jarvis -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass jarvis-ci -keypass jarvis-ci -dname "CN=Jarvis"
            fi
            echo "JARVIS_KEYSTORE_FILE=$HOME/.jarvis-signing/jarvis-ci.jks" >> "$GITHUB_ENV"
            echo "JARVIS_KEYSTORE_PASSWORD=jarvis-ci" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Wake word test (spoken "hi jarvis" through the app's model and grammar)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng sox > /dev/null
          pip install -q vosk
          python tools/wake_smoke_test.py app/build/generated/voskAssets/vosk-model.zip

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Jarvis.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish as a download link (Releases → "Jarvis latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis (latest build)
          prerelease: true
          files: Jarvis.apk
          body: |
            Latest Jarvis Android app, built from commit ${{ github.sha }}.
            On your phone: tap **Jarvis.apk** below, then open it to install.

name: Build Jarvis Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Claude brain, tools, storage)
        run: ./gradlew :core:test

      # New builds only install over old ones when signed with the same key.
      # Best: add a JARVIS_KEYSTORE_BASE64 + JARVIS_KEYSTORE_PASSWORD secret (see README).
      # Otherwise the debug key is cached between builds.
      - name: Use signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
          fi

      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Build APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Check the wake word is in the speech model's vocabulary
        run: |
          ZIP=app/build/generated/voskAssets/vosk-model.zip
          unzip -l "$ZIP" | grep -Ei "graph|words" || true
          if unzip -p "$ZIP" '*/graph/words.txt' 2>/dev/null | awk '{print $1}' | grep -qx jarvis; then
            echo "OK: 'jarvis' is in the model vocabulary"
          else
            echo "::warning::Could not confirm 'jarvis' is in the Vosk model vocabulary"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Jarvis.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish as a download link (Releases → "Jarvis latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis (latest build)
          prerelease: true
          files: Jarvis.apk
          body: |
            Latest Jarvis Android app, built from commit ${{ github.sha }}.
            On your phone: tap **Jarvis.apk** below, then open it to install.
